<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Slots - SmartPark</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-layout">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        
        <div class="main-content">
            <div th:replace="~{fragments/header :: header}"></div>
            
            <div class="content-wrapper">
                <div class="card glass-panel">
                    <div class="card-header" style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px;">
                        <h3>📍 Parking Slots</h3>
                        <div style="display: flex; gap: 10px; align-items: center;">
                            <select id="zoneFilter" class="form-select" onchange="loadSlots()" style="width: auto;">
                                <option value="">All Zones</option>
                                <option value="A">Zone A</option>
                                <option value="B">Zone B</option>
                                <option value="C">Zone C</option>
                            </select>
                            <button class="btn btn-primary" onclick="openSlotModal()">+ Add Slot</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="table-container">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Slot Number</th>
                                        <th>Zone</th>
                                        <th>Vehicle Type</th>
                                        <th>Status</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="slotsTable">
                                    <tr><td colspan="5" class="text-center">Loading...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Slot Modal -->
    <div id="slotModalOverlay" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Add Slot</h3>
                <button class="btn-close" onclick="closeSlotModal()">✕</button>
            </div>
            <div class="modal-body">
                <form id="slotForm" onsubmit="saveSlot(event)">
                    <input type="hidden" id="slotId">
                    <div class="form-group">
                        <label class="form-label">Slot Number</label>
                        <input class="form-input" type="text" id="slotNumber" required placeholder="e.g. A-101">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Zone</label>
                        <input class="form-input" type="text" id="slotZone" required placeholder="A, B, C...">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Vehicle Type</label>
                        <select class="form-select" id="vehicleType" required>
                            <option value="TWO_WHEELER">Two Wheeler</option>
                            <option value="FOUR_WHEELER">Four Wheeler</option>
                            <option value="HEAVY_VEHICLE">Heavy Vehicle</option>
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeSlotModal()">Cancel</button>
                <button class="btn btn-primary" onclick="document.getElementById('slotForm').requestSubmit()">Save Slot</button>
            </div>
        </div>
    </div>

    <div id="alert-container"></div>
    <script th:src="@{/js/app.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            requireAdmin();
            document.getElementById('pageTitle').innerText = 'Manage Slots';
            loadSlots();
        });

        async function loadSlots() {
            try {
                const zone = document.getElementById('zoneFilter').value;
                let url = '/api/admin/slots';
                if (zone) url += `?zone=${zone}`;
                
                const slots = await api.get(url);
                const tbody = document.getElementById('slotsTable');
                tbody.innerHTML = '';
                
                if (slots && slots.length > 0) {
                    slots.forEach(s => {
                        const isAvailable = !s.occupied;
                        const statusClass = isAvailable ? 'badge-success' : 'badge-danger';
                        const statusText = isAvailable ? 'AVAILABLE' : 'OCCUPIED';
                        
                        tbody.innerHTML += `
                            <tr>
                                <td><strong>${s.slotNumber}</strong></td>
                                <td>Zone ${s.zone}</td>
                                <td>${s.vehicleType}</td>
                                <td><span class="badge ${statusClass}">${statusText}</span></td>
                                <td>
                                    <button class="btn btn-sm btn-secondary" onclick='editSlot(${JSON.stringify(s)})'>✏️ Edit</button>
                                    <button class="btn btn-sm btn-danger" onclick="deleteSlot(${s.id})" ${s.occupied ? 'disabled' : ''}>🗑️ Delete</button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 30px; color: var(--text-muted);">No slots found. Add some slots!</td></tr>';
                }
            } catch (error) {
                showAlert('Error loading slots', 'danger');
            }
        }

        function openSlotModal() {
            document.getElementById('slotForm').reset();
            document.getElementById('slotId').value = '';
            document.getElementById('modalTitle').innerText = 'Add Slot';
            showModal('slotModalOverlay');
        }

        function closeSlotModal() {
            hideModal('slotModalOverlay');
        }

        function editSlot(s) {
            document.getElementById('slotId').value = s.id;
            document.getElementById('slotNumber').value = s.slotNumber;
            document.getElementById('slotZone').value = s.zone;
            document.getElementById('vehicleType').value = s.vehicleType;
            document.getElementById('modalTitle').innerText = 'Edit Slot';
            showModal('slotModalOverlay');
        }

        async function saveSlot(e) {
            e.preventDefault();
            const id = document.getElementById('slotId').value;
            const payload = {
                slotNumber: document.getElementById('slotNumber').value,
                zone: document.getElementById('slotZone').value,
                vehicleType: document.getElementById('vehicleType').value
            };

            try {
                if (id) {
                    await api.put(`/api/admin/slots/${id}`, payload);
                    showAlert('Slot updated successfully', 'success');
                } else {
                    await api.post('/api/admin/slots', payload);
                    showAlert('Slot added successfully', 'success');
                }
                closeSlotModal();
                loadSlots();
            } catch (error) {
                showAlert(error.message || 'Failed to save slot', 'danger');
            }
        }

        async function deleteSlot(id) {
            if (confirm('Are you sure you want to delete this slot?')) {
                try {
                    await api.delete(`/api/admin/slots/${id}`);
                    showAlert('Slot deleted', 'success');
                    loadSlots();
                } catch (error) {
                    showAlert(error.message || 'Failed to delete slot', 'danger');
                }
            }
        }
    </script>
</body>
</html>
