<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wallet - SmartPark</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-layout">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        
        <div class="main-content">
            <div th:replace="~{fragments/header :: header}"></div>
            
            <div class="content-wrapper" style="display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-start;">
                
                <!-- Left Column: Balance + Add Money -->
                <div style="flex: 1; min-width: 280px; max-width: 380px;">
                    <!-- Wallet Balance Card -->
                    <div class="card" style="background: linear-gradient(135deg, #00d4ff, #0099ff); border: none; text-align: center; padding: 40px 24px; margin-bottom: 24px; border-radius: 16px;">
                        <p style="color: rgba(255,255,255,0.8); font-size: 0.9rem; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px;">Available Balance</p>
                        <h1 id="walletBalance" style="color: white; font-size: 2.5rem; font-weight: 700; margin: 0;">-</h1>
                    </div>

                    <!-- Add Money Card -->
                    <div class="card glass-panel">
                        <div class="card-header">
                            <h3>➕ Add Money</h3>
                        </div>
                        <div class="card-body">
                            <form id="addMoneyForm" onsubmit="addMoney(event)">
                                <div class="form-group">
                                    <label class="form-label">Amount (₹)</label>
                                    <input class="form-input" type="number" id="amount" min="1" step="0.01" required placeholder="Enter amount">
                                </div>
                                <!-- Quick amount buttons -->
                                <div style="display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;">
                                    <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('amount').value=100">₹100</button>
                                    <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('amount').value=500">₹500</button>
                                    <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('amount').value=1000">₹1000</button>
                                    <button type="button" class="btn btn-secondary btn-sm" onclick="document.getElementById('amount').value=2000">₹2000</button>
                                </div>
                                <button type="submit" class="btn btn-primary btn-block">Add to Wallet</button>
                            </form>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Transaction History -->
                <div style="flex: 2; min-width: 400px;">
                    <div class="card glass-panel">
                        <div class="card-header">
                            <h3>📜 Transaction History</h3>
                            <button class="btn btn-secondary btn-sm" onclick="loadWalletData()">↻ Refresh</button>
                        </div>
                        <div class="card-body">
                            <div class="table-container">
                                <table class="data-table">
                                    <thead>
                                        <tr>
                                            <th>Date</th>
                                            <th>Type</th>
                                            <th>Amount</th>
                                            <th>Remarks</th>
                                        </tr>
                                    </thead>
                                    <tbody id="transactionsTable">
                                        <tr><td colspan="4" class="text-center">Loading...</td></tr>
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>
    <div id="alert-container"></div>
    <script th:src="@{/js/app.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            requireAuth();
            document.getElementById('pageTitle').innerText = 'Wallet';
            loadWalletData();
        });

        async function loadWalletData() {
            try {
                const [walletResult, history] = await Promise.all([
                    api.get('/api/wallet/balance'),
                    api.get('/api/wallet/transactions')
                ]);

                const balance = walletResult && walletResult.balance !== undefined ? walletResult.balance : walletResult;
                document.getElementById('walletBalance').innerText = formatCurrency(balance || 0);

                const tbody = document.getElementById('transactionsTable');
                tbody.innerHTML = '';

                if (history && history.length > 0) {
                    history.forEach(tx => {
                        const isCredit = tx.type === 'CREDIT';
                        const amountColor = isCredit ? 'var(--success)' : 'var(--danger)';
                        const sign = isCredit ? '+' : '-';
                        const typeClass = isCredit ? 'badge-success' : 'badge-danger';
                        tbody.innerHTML += `
                            <tr>
                                <td>${formatDate(tx.transactionDate)}</td>
                                <td><span class="badge ${typeClass}">${tx.type || '-'}</span></td>
                                <td style="color: ${amountColor}; font-weight: 600;">${sign}${formatCurrency(tx.amount)}</td>
                                <td style="color: var(--text-secondary);">${tx.remarks || '-'}</td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="4" style="text-align:center; padding: 40px; color: var(--text-muted);">No transactions yet. Add money to get started!</td></tr>';
                }
            } catch (error) {
                console.error(error);
                showAlert('Error loading wallet data', 'danger');
            }
        }

        async function addMoney(e) {
            e.preventDefault();
            const amount = parseFloat(document.getElementById('amount').value);
            if (isNaN(amount) || amount <= 0) {
                showAlert('Please enter a valid amount', 'warning');
                return;
            }
            try {
                await api.post('/api/wallet/add', { amount });
                showAlert(`✅ ₹${amount.toFixed(2)} added to wallet!`, 'success');
                document.getElementById('addMoneyForm').reset();
                loadWalletData();
            } catch (error) {
                showAlert(error.message || 'Failed to add money', 'danger');
            }
        }
    </script>
</body>
</html>
