<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Vehicles - SmartPark</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-layout">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        
        <div class="main-content">
            <div th:replace="~{fragments/header :: header}"></div>
            
            <div class="content-wrapper">
                <div class="card glass-panel">
                    <div class="card-header" style="display: flex; justify-content: space-between; align-items: center;">
                        <h3>My Vehicles</h3>
                        <button class="btn btn-primary" onclick="openVehicleModal()">+ Add Vehicle</button>
                    </div>
                    <div class="card-body">
                        <div class="table-container">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Vehicle Number</th>
                                        <th>Type</th>
                                        <th>Model</th>
                                        <th>Color</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="vehiclesTable">
                                    <tr><td colspan="5" class="text-center">Loading...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Vehicle Modal -->
    <div id="vehicleModalOverlay" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modalTitle">Add Vehicle</h3>
                <button class="btn-close" onclick="closeVehicleModal()">✕</button>
            </div>
            <div class="modal-body">
                <form id="vehicleForm" onsubmit="saveVehicle(event)">
                    <input type="hidden" id="vehicleId">
                    <div class="form-group">
                        <label class="form-label">Vehicle Number</label>
                        <input class="form-input" type="text" id="vehicleNumber" required placeholder="e.g. MH12AB1234">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Type</label>
                        <select class="form-select" id="vehicleType" required>
                            <option value="TWO_WHEELER">Two Wheeler</option>
                            <option value="FOUR_WHEELER">Four Wheeler</option>
                            <option value="HEAVY_VEHICLE">Heavy Vehicle</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label class="form-label">Model</label>
                        <input class="form-input" type="text" id="vehicleModel" required placeholder="e.g. Honda City">
                    </div>
                    <div class="form-group">
                        <label class="form-label">Color</label>
                        <input class="form-input" type="text" id="vehicleColor" required placeholder="e.g. White">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeVehicleModal()">Cancel</button>
                <button class="btn btn-primary" onclick="document.getElementById('vehicleForm').requestSubmit()">Save</button>
            </div>
        </div>
    </div>

    <div id="alert-container"></div>
    <script th:src="@{/js/app.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            requireAuth();
            document.getElementById('pageTitle').innerText = 'My Vehicles';
            loadVehicles();
        });

        async function loadVehicles() {
            try {
                const vehicles = await api.get('/api/vehicles');
                const tbody = document.getElementById('vehiclesTable');
                tbody.innerHTML = '';
                
                if (vehicles && vehicles.length > 0) {
                    vehicles.forEach(v => {
                        const typeLabel = {
                            'TWO_WHEELER': '🏍️ Two Wheeler',
                            'FOUR_WHEELER': '🚗 Four Wheeler',
                            'HEAVY_VEHICLE': '🚛 Heavy Vehicle'
                        }[v.vehicleType] || v.vehicleType;

                        tbody.innerHTML += `
                            <tr>
                                <td><strong>${v.vehicleNumber}</strong></td>
                                <td>${typeLabel}</td>
                                <td>${v.model || '-'}</td>
                                <td>${v.color || '-'}</td>
                                <td>
                                    <button class="btn btn-sm btn-secondary" onclick='editVehicle(${JSON.stringify(v)})'>✏️ Edit</button>
                                    <button class="btn btn-sm btn-danger" onclick="deleteVehicle(${v.id})">🗑️ Delete</button>
                                </td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="5" style="text-align:center; padding: 40px; color: var(--text-muted);">🚗 No vehicles registered yet. Add your first vehicle!</td></tr>';
                }
            } catch (error) {
                showAlert('Error loading vehicles', 'danger');
            }
        }

        function openVehicleModal() {
            document.getElementById('vehicleForm').reset();
            document.getElementById('vehicleId').value = '';
            document.getElementById('modalTitle').innerText = 'Add Vehicle';
            showModal('vehicleModalOverlay');
        }

        function closeVehicleModal() {
            hideModal('vehicleModalOverlay');
        }

        function editVehicle(v) {
            document.getElementById('vehicleId').value = v.id;
            document.getElementById('vehicleNumber').value = v.vehicleNumber;
            document.getElementById('vehicleType').value = v.vehicleType;
            document.getElementById('vehicleModel').value = v.model || '';
            document.getElementById('vehicleColor').value = v.color || '';
            document.getElementById('modalTitle').innerText = 'Edit Vehicle';
            showModal('vehicleModalOverlay');
        }

        async function saveVehicle(e) {
            e.preventDefault();
            const id = document.getElementById('vehicleId').value;
            const payload = {
                vehicleNumber: document.getElementById('vehicleNumber').value,
                vehicleType: document.getElementById('vehicleType').value,
                model: document.getElementById('vehicleModel').value,
                color: document.getElementById('vehicleColor').value
            };

            try {
                if (id) {
                    await api.put(`/api/vehicles/${id}`, payload);
                    showAlert('Vehicle updated successfully', 'success');
                } else {
                    await api.post('/api/vehicles/add', payload);
                    showAlert('Vehicle added successfully', 'success');
                }
                closeVehicleModal();
                loadVehicles();
            } catch (error) {
                showAlert(error.message || 'Failed to save vehicle', 'danger');
            }
        }

        async function deleteVehicle(id) {
            if (confirm('Are you sure you want to delete this vehicle?')) {
                try {
                    await api.delete(`/api/vehicles/${id}`);
                    showAlert('Vehicle deleted', 'success');
                    loadVehicles();
                } catch (error) {
                    showAlert(error.message || 'Failed to delete vehicle', 'danger');
                }
            }
        }
    </script>
</body>
</html>
