<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - SmartPark</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="app-layout">
        <div th:replace="~{fragments/sidebar :: sidebar}"></div>
        
        <div class="main-content">
            <div th:replace="~{fragments/header :: header}"></div>
            
            <div class="content-wrapper">
                <div class="stats-grid">
                    <div class="stat-card glass-panel card">
                        <div class="stat-icon">👥</div>
                        <div class="stat-details">
                            <div class="stat-label">Total Users</div>
                            <div class="stat-value" id="statUsers">0</div>
                        </div>
                    </div>
                    <div class="stat-card glass-panel card">
                        <div class="stat-icon">📍</div>
                        <div class="stat-details">
                            <div class="stat-label">Total Slots</div>
                            <div class="stat-value" id="statSlots">0</div>
                        </div>
                    </div>
                    <div class="stat-card glass-panel card">
                        <div class="stat-icon">🅿️</div>
                        <div class="stat-details">
                            <div class="stat-label">Active Sessions</div>
                            <div class="stat-value" id="statActiveSessions">0</div>
                        </div>
                    </div>
                    <div class="stat-card glass-panel card">
                        <div class="stat-icon">💰</div>
                        <div class="stat-details">
                            <div class="stat-label">Total Revenue</div>
                            <div class="stat-value" id="statRevenue">₹0.00</div>
                        </div>
                    </div>
                </div>

                <div class="card glass-panel mt-4">
                    <div class="card-header">
                        <h3>System Activity (Recent Sessions)</h3>
                        <button class="btn btn-secondary btn-sm" onclick="loadDashboard()">↻ Refresh</button>
                    </div>
                    <div class="card-body">
                        <div class="table-container">
                            <table class="data-table">
                                <thead>
                                    <tr>
                                        <th>Activity Type</th>
                                        <th>Description</th>
                                        <th>Time</th>
                                    </tr>
                                </thead>
                                <tbody id="activityTable">
                                    <tr><td colspan="3" class="text-center">Loading...</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div id="alert-container"></div>
    <script th:src="@{/js/app.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            requireAdmin();
            document.getElementById('pageTitle').innerText = 'Admin Dashboard';
            loadDashboard();
        });

        async function loadDashboard() {
            try {
                const [stats, activities] = await Promise.all([
                    api.get('/api/admin/dashboard/stats'),
                    api.get('/api/admin/dashboard/activity')
                ]);

                document.getElementById('statUsers').innerText = stats.totalUsers || 0;
                document.getElementById('statSlots').innerText = stats.totalSlots || 0;
                document.getElementById('statActiveSessions').innerText = stats.activeSessions || 0;
                document.getElementById('statRevenue').innerText = formatCurrency(stats.totalRevenue || 0);

                const tbody = document.getElementById('activityTable');
                tbody.innerHTML = '';
                
                if (activities && activities.length > 0) {
                    activities.forEach(act => {
                        const badgeClass = act.type === 'PARKING' ? 'badge-success' : 'badge-info';
                        tbody.innerHTML += `
                            <tr>
                                <td><span class="badge ${badgeClass}">${act.type || 'INFO'}</span></td>
                                <td>${act.description}</td>
                                <td>${formatDate(act.timestamp)}</td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center; padding: 20px; color: var(--text-muted);">No recent activity.</td></tr>';
                }
            } catch (error) {
                console.error(error);
                showAlert('Error loading admin dashboard', 'danger');
            }
        }
    </script>
</body>
</html>
